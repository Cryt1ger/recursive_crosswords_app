<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#D5F0FF">
  <title>Рекурсивные кроссворды</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://telegram.org/js/telegram-web-app.js" defer></script>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <h1>Рекурсивные кроссворды</h1>
      </div>
      <div class="stats">
        <div class="score" id="score" aria-live="polite">100</div>
        <div class="timer" id="timer" title="Время решения" aria-label="Время решения">00:00</div>
      </div>
    </header>

    <section class="composer" id="composer" aria-label="Окно ввода ответов">
      <div class="composer-head">
        <span class="progress" id="progress">0 / 0</span>
      </div>
      <div class="clue-preview" id="clue"></div>
      <div class="hint-row">
        <button id="hint1" class="hint-btn" type="button">Буква −10</button>
        <button id="hint2" class="hint-btn" type="button">Слово −25</button>
      </div>
      <div class="hint-text" id="hintText" aria-live="polite"></div>
      <form id="form">
        <input id="answer" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Ответ на любую загадку">
        <button id="submit" class="primary" type="submit">Ответить</button>
      </form>
      <div class="feedback" id="feedback" aria-live="polite"></div>
    </section>

    <main>
      <p class="lead">Решай внутренние загадки — их ответы прояснят внешние.</p>
      <section class="card">
        <div class="puzzle" id="puzzle"></div>
      </section>
      <p class="tip">Вводи любой ответ сверху — приложение само найдёт нужную загадку. Нажми на загадку, чтобы увидеть её текст и взять подсказку.</p>
      <section class="log" id="logSection" hidden>
        <h2>Уже открыто</h2>
        <ol class="log-list" id="log"></ol>
      </section>
    </main>
  </div>

  <div class="toast" id="toast" hidden></div>

  <div class="overlay" id="complete" hidden>
    <div class="finish-card">
      <div class="finish-badge">Готово</div>
      <p class="finish-text" id="finishText"></p>
      <div class="finish-stats">
        <span>Баллы: <strong id="finishScore"></strong></span>
        <span>Время: <strong id="finishTime"></strong></span>
      </div>
      <button id="again" class="primary" type="button">Ещё раз</button>
    </div>
  </div>

  <script src="content.js"></script>
  <script src="app.js"></script>
</body>
</html>
